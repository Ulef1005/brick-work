          type: string
          description: Totals and comparisons across currencies convert into this (#39).
        retail_country:
          type: string
          enum:
          - DE
          - US
          - UK
          - CA
        bricklink_region:
          type: string
        bricklink_currency:
          type: string
          pattern: ^[A-Z]{3,8}$
        incomplete_discount_pct:
          type: number
        source_priority:
          type: object
          description: 'Source order per step and item kind: `{step: {kind or "*": [source ids]}}`, the steps being `pictures` (design 6.8), `metadata` and `market_price`. A step that is sent replaces that step; a step that is left out keeps its order.'
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        import_order: {}
        freshness: {}
        repair: {}
        prefer_bricklink_inventory:
          type: boolean
          description: New copies take BrickLink's part list when one exists (design 4.4).
    SettingsPatch:
      type: object
      properties:
        display_currency:
          type: string
          description: Totals and comparisons across currencies convert into this (#39).
        retail_country:
          type: string
          enum:
          - DE
          - US
          - UK
          - CA
        bricklink_region:
          type: string
        bricklink_currency:
          type: string
          pattern: ^[A-Z]{3,8}$
        incomplete_discount_pct:
          type: number
        source_priority:
          type: object
          description: 'Source order per step and item kind: `{step: {kind or "*": [source ids]}}`, the steps being `pictures` (design 6.8), `metadata` and `market_price`. A step that is sent replaces that step; a step that is left out keeps its order.'
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        import_order: {}
        freshness: {}
        repair: {}
        prefer_bricklink_inventory:
          type: boolean
          description: New copies take BrickLink's part list when one exists (design 4.4).
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - bad_request
          - unknown_filter
          - unauthorized
          - forbidden
          - read_only_instance
          - not_found
          - method_not_allowed
          - api_retired
          - moved
          - archived
          - ambiguous
          - merged
          - conflict
          - stale_match
          - undo_blocked
          - not_undoable
          - idempotency_conflict
          - precondition_failed
          - payload_too_large
          - unsupported_media_type
          - validation_failed
          - unsupported_setting
          - unidentified
          - source_not_configured
          - source_disabled
          - catalogue_not_loaded
          - idempotency_key_required
          - budget_exhausted
          - source_throttled
          - too_many_attempts
          - source_error
          - not_set_up
          - api_disabled
          - db_unavailable
          - internal_error
          - not_implemented
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        retry_after:
          type:
          - integer
          - 'null'
        job_id:
          type:
          - integer
          - 'null'
        source:
          type:
          - string
          - 'null'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          description: 'With ambiguous: the items the number names.'
        survivor:
          type: integer
          description: 'With merged and moved: the live item''s id.'
        piece:
          type: string
          description: 'With not_implemented: the piece that brings the operation.'
        error:
          type: string
          description: 'With not_implemented: the same as code.'
      required:
      - type
      - title
      - status
      - code
