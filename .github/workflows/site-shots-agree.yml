# The tutorial screenshots are reproducible (App Docs Standard, screenshot standard; doc-standard-v1 B3): renders them twice on the platform the gate
# compares on (ubuntu-latest, linux64) and fails when any file differs by even one byte. Run by hand; both renders are kept as the `site-shots-agree` artifact.
name: site-shots-agree

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/site-shots-agree.yml"]   # a new workflow file can only be dispatched from the default branch, so the pull request that changes it runs it

permissions:
  contents: read

jobs:
  agree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache Chrome for Testing
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/brickwork/chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('scripts/chrome.py') }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Render the tutorial shots twice, compare byte for byte
        run: |
          shots=$(.venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); import site_shots; print(' '.join(k for k in site_shots.EXTRAS))")
          .venv/bin/python scripts/site_shots.py --only $shots --out build/shots-1
          .venv/bin/python scripts/site_shots.py --only $shots --out build/shots-2
          diff -r build/shots-1 build/shots-2 && echo "byte-identical: $(ls build/shots-1 | wc -l) files"
        env:
          BW_CHROME_NO_SANDBOX: "1"
      - name: Upload both renders
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: site-shots-agree
          path: build/shots-*/
          if-no-files-found: ignore
