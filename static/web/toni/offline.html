<html lang="en" data-theme-default="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brick Work · Offline</title><script src="/static/web/toni/theme.js"></script><link rel="stylesheet" href="/static/web/toni/tokens-v2.css"><link rel="stylesheet" href="/static/web/toni/toni.css"><link rel="stylesheet" href="/static/brickwork/brick-work.css"><link rel="stylesheet" href="/static/web/toni/shell.css"><link rel="stylesheet" href="/static/brickwork/b-prime.css"><link rel="stylesheet" href="/static/web/toni/bw-system-b.css"></head>
<!-- The offline page in B′ (frame 53, approved by Ulf 23.11.): the service worker serves this precached copy when a page is opened without a
     connection. The drawer is the system pages' (components/system_art.html), labelled OFFLINE; Try again reloads the page that was asked for. -->
<body><main class="system-page b-prime sys-page" role="alert" data-system-variant="offline">

<div class="sys-text"><h1>Your drawers are out of reach</h1><p class="sys-lead">No connection to your Brick Work server. Your collection is safe where it is. Reconnect and try again.</p>
<div class="sys-actions"><a class="btn" href="">Try again</a></div>
<p class="mono sys-code">No connection · offline</p></div></main></body></html>
