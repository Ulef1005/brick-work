          - largest
          - colour
        scope:
          type: string
          description: 'start only: `all` walks the whole set (a fresh start without `scope` does too); `missing` walks only the parts the last check left missing (the others keep their answers; refused with 422 when none is missing). Left out, a start resumes the running check; a named scope that is not the running one replaces it (Undo brings it back).'
