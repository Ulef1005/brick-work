{# Selection bar (as the Sets list's select mode, and BrickLink's "0 selected · Move · Copy"): shown while wishes are selected. #}
{% if can_edit %}<form class="bc-selection-bar wl-selection" data-wl-action="transfer" data-wl-selection hidden><span data-wl-count class="mono">0 selected</span><label class="wl-target">To<select name="list_id">{% for l in wishlists if not l.archived_at %}<option value="{{ l.id }}">{{ l.name }}</option>{% endfor %}</select></label><button class="primary bw-primary" name="copy" value="false">Move</button><button name="copy" value="true">Copy</button><button type="button" data-wl-clear>Clear</button></form>{% endif %}
