      required:
      - currency
      - copies
      - comparable_copies
      - enough
      - paid
      - worth
      - gain
      - percent
      - without_price_paid
      - without_quote
      - without_rate
      - worth_without_price_paid
      - converted
      - rates_as_of
      - by_theme
      - by_year
      properties:
        currency:
          type: string
        copies:
          type: integer
          description: The live copies.
        comparable_copies:
          type: integer
        enough:
          type: boolean
          description: Three or more comparable copies; under that the screen says "Charts need more data".
        paid:
          type: [string, 'null']
        worth:
          type: [string, 'null']
        gain:
          type: [string, 'null']
          description: Negative for a loss.
        percent:
          type: [integer, 'null']
        without_price_paid:
          type: integer
        without_quote:
          type: integer
        without_rate:
          type: integer
          description: Copies with a price paid or a worth that needs a rate that is missing.
        worth_without_price_paid:
          type: [string, 'null']
          description: The worth of the copies that have a worth and no price paid; never in the totals.
        converted:
          type: boolean
        rates_as_of:
          type: [string, 'null']
          description: The oldest rate date among the converted figures.
        by_theme:
          type: array
          description: Largest price paid first.
          items:
            $ref: '#/components/schemas/ValuationGroup'
        by_year:
          type: array
          description: Purchase years ascending; `Not recorded` last.
          items:
            $ref: '#/components/schemas/ValuationGroup'
