components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Authorization: Bearer <token>. Scopes: read, write, admin (admin includes write, write includes read). Listed per operation."
  parameters:
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
      description: "Opaque cursor from page.next_cursor."
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
    DirectionNewest:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Direction:
      name: "direction"
      in: "query"
      schema:
        type: "string"
        enum:
          - "asc"
          - "desc"
        default: "asc"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      schema:
        type: "string"
        maxLength: 80
        pattern: "^[A-Za-z0-9-]{1,80}$"
      description: "Optional replay protection (see api-v1.md)."
    IdempotencyKeyRequired:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        maxLength: 80
        pattern: "^[A-Za-z0-9-]{1,80}$"
      description: "Required: the operation creates records or moves quantities."
    IfMatch:
      name: "If-Match"
      in: "header"
      required: false
      schema:
        type: "string"
      description: "ETag from the last read; mismatch gives 412."
    Q_type:
      name: "type"
      in: "query"
      schema:
        type: "string"
      description: "Item type letter (S M P I O G B C ?)."
    Q_q:
      name: "q"
      in: "query"
      schema:
        type: "string"
      description: "Text over name, number, colour, category, theme, year (case-insensitive substring, as the web lists)."
    Q_sort:
      name: "sort"
      in: "query"
      schema:
        type: "string"
      description: "One of number, name, year, quantity, missing, damaged, used_price, colour. Default number; planning defaults to ranking (core group, pin, ratio and gain order)."
    Path_type:
      name: "type"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/ItemTypeLetter"
    Path_no:
      name: "no"
      in: "path"
      required: true
      schema:
        type: "string"
    Path_color_id_int:
      name: "color_id"
      in: "path"
      required: true
      schema:
        type: "integer"
    Q_theme:
      name: "theme"
      in: "query"
      schema:
        type: "string"
      description: "Theme name."
    Q_category:
      name: "category"
      in: "query"
      schema:
        type: "string"
      description: "Category name."
    Q_year:
      name: "year"
      in: "query"
      schema:
        type: "string"
      description: "Year."
    Q_owned:
      name: "owned"
      in: "query"
      schema:
        type: "string"
      description: "true to list only owned items."
    Path_id_int:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "integer"
    Q_item_no:
      name: "item_no"
      in: "query"
      schema:
        type: "string"
      description: "BrickLink item number."
    Q_condition:
      name: "condition"
      in: "query"
      schema:
        type: "string"
      description: "new, used, damaged for copies and stock; new, used, any for wishes."
    Q_status:
      name: "status"
      in: "query"
      schema:
        type: "string"
      description: "Completeness sealed, complete, incomplete or unknown (copies); order status (orders)."
    Q_storage:
      name: "storage"
      in: "query"
      schema:
        type: "string"
      description: "Storage id, or null for Not stored."
    Q_place:
      name: "place"
      in: "query"
      schema:
        type: "string"
      description: "Purchase location id, or null."
    Q_flag:
      name: "flag"
      in: "query"
      schema:
        type: "string"
