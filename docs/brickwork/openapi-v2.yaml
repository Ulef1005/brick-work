        parts_total:
          type: integer
          description: Pieces of the set's own parts, spares and a minifigure's components left out, the parts of its sub-sets in.
        percent:
          type: number
          description: parts_available over parts_total, in percent to one decimal. Swaps are never in it.
        missing_parts:
          type: integer
          description: parts_total less parts_available, in pieces.
        missing_lines:
          type: integer
          description: Part lines the stock does not cover in full.
        figures_available:
          type: integer
          description: The sum over the set's whole-figure lines of min(have, need) (a loose whole figure counts).
        figures_required:
          type: integer
        missing_figures:
          type: integer
        nested:
          type: boolean
          description: true when the set is made of other sets; Build it does not handle those.
        gaps:
          type: array
          description: With `detail`, the biggest missing part lines.
          items:
            $ref: '#/components/schemas/BuildScoutGap'
        figure_gaps:
          type: array
          description: With `detail`, the whole figures that are missing.
          items:
            $ref: '#/components/schemas/BuildScoutGap'
        cost:
          type: object
          description: With `detail`, the missing parts and figures priced from the current prices.
          required:
          - amount
          - currency
          - priced_lines
          - unpriced_lines
          properties:
            amount:
              type:
              - string
              - 'null'
              description: The sum, two decimals; null when no missing line has a price.
            currency:
              type:
              - string
              - 'null'
            priced_lines:
              type: integer
            unpriced_lines:
              type: integer
        swaps:
          type: object
          description: With `detail`, listed apart and never in any number above (the engine's swaps, ADR 0026).
          required:
          - lines
          - quantity
          - items
          properties:
            lines:
              type: integer
            quantity:
              type: integer
            items:
              type: array
              items:
                type: object
                required:
                - kind
                - have
                - wanted
                - quantity
                properties:
                  kind:
                    type: string
                    enum:
                    - colour
                    - mould
                  have:
                    $ref: '#/components/schemas/SetScoreLine'
                  wanted:
                    $ref: '#/components/schemas/SetScoreLine'
                  quantity:
                    type: integer
    BuildScoutGap:
      type: object
      required:
      - item
      - color
      - need
      - have
      - missing
      properties:
        item:
          $ref: '#/components/schemas/Item'
        color:
          oneOf:
          - $ref: '#/components/schemas/Color'
          - type: 'null'
        need:
          type: integer
        have:
          type: integer
          description: min(stock, need).
        missing:
          type: integer
    BuildFromStockRequest:
      type: object
      additionalProperties: false
      properties:
        lots:
          type: array
          items:
            type: string
          maxItems: 500
          uniqueItems: true
        storages:
          type: array
          items:
            type: string
          maxItems: 500
          uniqueItems: true
        loose:
          type: boolean
        damaged:
          type: boolean
    BuildFromStock:
      type: object
      required:
      - copy_id
      - item
      - pieces
      - figures
      - missing_parts
      - missing_figures
      - completeness
      properties:
        copy_id:
          type: string
        item:
          $ref: '#/components/schemas/Item'
        pieces:
          type: integer
          description: Loose parts moved into the copy.
        figures:
          type: integer
          description: Whole loose figures moved into the copy.
        missing_parts:
          type: integer
          description: Pieces recorded as missing on the copy.
        missing_figures:
          type: integer
        completeness:
          type: string
          enum:
          - complete
          - incomplete
    ChangeVariantRequest:
      type: object
      required:
      - to
      additionalProperties: false
      properties:
        to:
          $ref: '#/components/schemas/ItemKey'
    VariantChange:
      type: object
      required:
      - from
      - to
      - number
      properties:
        from:
          $ref: '#/components/schemas/Item'
        to:
          $ref: '#/components/schemas/Item'
        number:
          type:
          - string
          - 'null'
          description: The BrickLink number that became the new item's preferred link; null when neither item had one to move.
        receipt:
          description: What moved, as `{event_id, counts}`.
    CopyInventory:
      type: object
      required:
      - source
      - version
      - ordinal
      - of
      - pending
      - changed_since_build
      properties:
        source:
          type: string
          enum:
          - rebrickable
          - bricklink
          - rebrickable_api
          - migrated
          - none
        version:
          type:
          - integer
          - 'null'
          description: The Rebrickable inventory version, when the source is rebrickable.
        ordinal:
          type:
          - integer
          - 'null'
          description: Which of the set's lists this is, 1-based, newest last.
        of:
          type: integer
          description: How many lists the set has.
        pending:
          type:
          - string
          - 'null'
          enum:
          - bricklink
          - null
          description: bricklink while a switch waits for its fetch job.
        changed_since_build:
          type: boolean
          description: The catalogue's list for this version changed in a later build.
    CopyInventorySwitch:
      type: object
      required:
      - source
      additionalProperties: false
      properties:
        source:
          type: string
          enum:
          - rebrickable
          - bricklink
        version:
          type: integer
          description: 'With rebrickable: the version; default the latest.'
        remember:
          type: boolean
          description: Also use this list for new copies of the set (the set's part-list preference), in the same event.
    CatalogueStatus:
      type: object
      required:
      - loaded
      properties:
        loaded:
          type: boolean
        items:
          type: integer
        builds:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              built_at:
                type: string
                format: date-time
              dump_date:
                type:
                - string
                - 'null'
              mapping_version:
                type:
                - string
                - 'null'
              local_mapping_manifest: {}
              bricklink_list: {}
              activated:
                type: boolean
        coverage:
          type: object
          description: Item links per status.
          properties:
            matched:
              type: integer
            inferred:
              type: integer
            manual:
              type: integer
            to_check:
              type: integer
        last_reconcile:
          type:
          - object
          - 'null'
          properties:
            at:
              type: string
              format: date-time
            summary: {}
    OneItem:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Item'
    ListOfItemLink:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemLink'
    ListOfItemProviderStatus:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemProviderStatus'
    ListOfLinkRow:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LinkRow'
        page:
          $ref: '#/components/schemas/PageInfo'
    WrittenItemLink:
      type: object
      required:
      - data
      - event_id
      properties:
        data:
          $ref: '#/components/schemas/ItemLink'
        event_id:
          type:
          - integer
          - 'null'
          description: The event of the change; null when the link was there as asked (the call is idempotent per link).
        undo_url:
          type: string
        idempotent_replay:
          type: boolean
    WrittenBuild:
      type: object
      required:
      - data
      - event_id
      properties:
        data:
          $ref: '#/components/schemas/BuildFromStock'
        event_id:
          type: integer
        undo_url:
          type: string
        idempotent_replay:
          type: boolean
    WrittenVariantChange:
      type: object
      required:
      - data
      - event_id
      properties:
        data:
          $ref: '#/components/schemas/VariantChange'
        event_id:
          type: integer
        undo_url:
          type: string
        idempotent_replay:
          type: boolean
    WrittenMerge:
      type: object
      required:
      - data
      - event_id
      properties:
        data:
          $ref: '#/components/schemas/Merge'
        event_id:
          type: integer
        undo_url:
          type: string
        idempotent_replay:
          type: boolean
