        provider:
          type: string
        type:
          type: string
        'no':
          type: string
        color_id:
          description: The BrickLink colour id the link is scoped to; null for every colour, or for a scope that has no BrickLink colour (see `color_scoped`).
          type:
          - integer
          - 'null'
        color_scoped:
          description: True when the link applies to one colour only.
          type: boolean
        brickwork_color_id:
          description: The scope in Brick Work's own colour space; set exactly when `color_scoped`.
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - matched
          - inferred
          - manual
          - to_check
        method:
          type: string
        origin:
          type: string
          enum:
          - shipped
          - local
          - rule
          - bricklink_list
          - api
          - user
          - migration
        preferred:
          type: boolean
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
    ItemLinkWrite:
      type: object
      required:
      - type
      - 'no'
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
          - bricklink
          default: bricklink
        type:
          type: string
          enum:
          - S
          - P
          - M
          - G
          - B
          - C
          - I
          - O
        'no':
          type: string
        color_id:
          type:
          - integer
          - 'null'
          description: BrickLink colour id to scope the link to; null for every colour.
        preferred:
          type: boolean
          description: 'Make this the preferred link for its colour scope; the previous one stops being preferred. false means no change to the preference: a preference is replaced by marking another link preferred, never cleared to none (there is always a resolver order).'
    ItemProviderStatus:
