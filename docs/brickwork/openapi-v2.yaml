        bricklink_id:
          type:
          - integer
          - 'null'
        rebrickable_id:
          type:
          - integer
          - 'null'
    ItemBrickLink:
      type: object
      required:
      - type
      - 'no'
      - color_id
      - color_scoped
      - brickwork_color_id
      - preferred
      properties:
        type:
          type: string
          enum:
          - S
          - P
          - M
          - G
          - B
          - C
          - I
          - O
          description: BrickLink item type.
        'no':
          type: string
        color_id:
          type:
          - integer
          - 'null'
          description: The BrickLink colour id the link is scoped to. Null with color_scoped false holds for every colour (design 3.2); null with color_scoped true
            is a link scoped to a colour that has no BrickLink id (see brickwork_color_id), never "every colour".
        color_scoped:
          type: boolean
          description: True when the link holds for one colour only.
        brickwork_color_id:
          type:
          - integer
          - 'null'
          description: The Brick Work colour id the link is scoped to; null when color_scoped is false.
        preferred:
          type: boolean
    Item:
      type: object
      required:
      - id
      - kind
      - name
      - unidentified
      - bricklink
      - rebrickable
      properties:
        id:
          type: integer
          description: 'Brick Work id: per install, not stable across installs (design 3.1).'
        kind:
          $ref: '#/components/schemas/Kind'
        name:
          type: string
        unidentified:
          type: boolean
          description: 'A local item that is not born at Rebrickable: no born key, or a BrickLink-only number (design 3.8). Replaces v1''s `?` type.'
        bricklink:
          type: array
          items:
            $ref: '#/components/schemas/ItemBrickLink'
          description: Confirmed BrickLink links, preferred first; colour-scoped rows list their colour.
        rebrickable:
          oneOf:
          - type: object
            required:
            - key
            properties:
              key:
                type: string
          - type: 'null'
        color:
          allOf:
          - $ref: '#/components/schemas/Color'
          description: 'Only on a by-number or lookup answer given a color: the resolved Brick Work colour.'
    ItemKey:
      type: object
      description: 'Names an item in a request: by id, or by provider number (decision 3: the default provider is bricklink). The colour next to it is in
        the same provider space.'
      properties:
        id:
          type: integer
        provider:
          type: string
          enum:
          - bricklink
          - rebrickable
          default: bricklink
        kind:
          $ref: '#/components/schemas/Kind'
        key:
          type: string
      oneOf:
      - required:
        - id
      - required:
        - kind
        - key
    ItemLink:
