          description: How many the set holds (a matched line only).
        covered:
          type: integer
          description: min(quantity, need) (a matched line only).
        weight:
          type: number
          description: The line's rarity weight ln(N/df) (a matched line only).
        flags:
          type: array
          items:
            type: string
    SetScore:
