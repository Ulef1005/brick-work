  bad_request: 400
  unknown_filter: 400
  unauthorized: 401
  forbidden: 403
  read_only_instance: 403
  not_found: 404
  method_not_allowed: 405
  ambiguous: 409
  archived: 409
  conflict: 409
  idempotency_conflict: 409
  merged: 409
  not_undoable: 409
  stale_match: 409
  undo_blocked: 409
  api_retired: 410
  precondition_failed: 412
  payload_too_large: 413
  unsupported_media_type: 415
  unidentified: 422
  unsupported_setting: 422
  validation_failed: 422
  catalogue_not_loaded: 424
  source_disabled: 424
  source_not_configured: 424
  idempotency_key_required: 428
  budget_exhausted: 429
  source_throttled: 429
  too_many_attempts: 429
  internal_error: 500
  not_implemented: 501
  source_error: 502
  api_disabled: 503
  db_unavailable: 503
  not_set_up: 503
