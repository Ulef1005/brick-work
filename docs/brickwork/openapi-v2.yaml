              - 'null'
            currency:
              type: string
            lines:
              type: integer
            priced:
              type: integer
            unpriced:
              description: Up to 50 lines without a usable quote.
              type: array
              items:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/Item'
                  color:
                    oneOf:
                    - $ref: '#/components/schemas/Color'
