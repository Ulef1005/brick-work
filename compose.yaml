services:
  brickwork:
    container_name: brickwork
    restart: unless-stopped
    # `docker compose pull` fetches the published image below (amd64 and arm64).
    # `docker compose build` builds the same name from this source instead;
    # `docker compose pull` brings the published image back.
    # The tag is this release's version: a checkout of tag vX.Y.Z runs image X.Y.Z.
    image: ghcr.io/ulef1005/brick-work:1.0.0
    build: .
    # The image runs as uid 1000; to use another user, set user: and make ./data writable for it.
    # user: "1000:1000"
    ports:
      # This computer only. To reach the app from your network, set a password first, then use "3333:3333".
      - "127.0.0.1:3333:3333"
    volumes:
      - ./data:/app/data/
    # Settings go in data/.env; environment variables win over it.
    # A .env in the project root is the fallback:
    # env_file: ".env"
