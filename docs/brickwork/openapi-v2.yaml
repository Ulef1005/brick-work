      - brickwork_color_id
      - status
      - preferred
      properties:
        provider:
          type: string
        type:
          type: string
        'no':
          type: string
        color_id:
          description: The BrickLink colour id the link is scoped to; null for every colour, or for a scope that has no BrickLink colour (see `color_scoped`).
          type:
          - integer
          - 'null'
        color_scoped:
          description: True when the link applies to one colour only.
          type: boolean
        brickwork_color_id:
          description: The scope in Brick Work's own colour space; set exactly when `color_scoped`.
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - matched
          - inferred
          - manual
          - to_check
        method:
          type: string
        origin:
          type: string
          enum:
          - shipped
          - local
          - rule
          - bricklink_list
          - api
          - user
          - migration
        preferred:
          type: boolean
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
