        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyInventorySwitch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrittenCopy'
        '202':
          description: 'Pending: the BrickLink list is being fetched (the Job is data.inventory.pending).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrittenCopy'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Invalid'
        default:
          $ref: '#/components/responses/Problem'
      x-piece: M.11c
  /copies/{id}/inventory/pending:
    delete:
      operationId: delete_copies_by_id_inventory_pending
      summary: 'Cancel a pending BrickLink switch (design 4.4): the copy keeps its current list.'
      tags:
      - Copies
      security:
      - bearerAuth:
        - write
      parameters:
      - $ref: '#/components/parameters/Path_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrittenCopy'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
      x-piece: M.11c
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <token>. Scopes: read, write, admin (admin includes write, write includes read). Listed per operation.'
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from page.next_cursor.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    DirectionNewest:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 80
        pattern: ^[A-Za-z0-9-]{1,80}$
      description: Optional replay protection (see api-v1.md).
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 80
        pattern: ^[A-Za-z0-9-]{1,80}$
      description: 'Required: the operation creates records or moves quantities.'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag from the last read; mismatch gives 412.
    Q_q:
      name: q
      in: query
      schema:
        type: string
      description: Text over name, number, colour, category, theme, year (case-insensitive substring, as the web lists).
    Q_sort:
      name: sort
      in: query
      schema:
        type: string
      description: One of number, name, year, quantity, missing, damaged, used_price, colour, added. Default number; planning defaults to ranking (core group,
        pin, ratio and gain order). `added` (on /copies) is when the copy was added to Brick Work.
    Path_color_id_int:
      name: color_id
      in: path
      required: true
      schema:
        type: integer
    Q_theme:
      name: theme
      in: query
      schema:
        type: string
      description: Theme name.
    Q_category:
      name: category
      in: query
      schema:
        type: string
      description: Category name.
    Q_year:
      name: year
      in: query
      schema:
        type: string
      description: Year.
    Q_owned:
      name: owned
      in: query
      schema:
        type: string
      description: true to list only owned items.
    Path_id_int:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Path_image_id:
      name: id
      in: path
      required: true
      description: A cached provider picture's number, or an own photo's 32-character hex id (`Image.id`).
      schema:
        oneOf:
        - type: integer
        - type: string
          pattern: ^[0-9a-f]{32}$
    Q_condition:
      name: condition
      in: query
      schema:
        type: string
      description: new, used, damaged for copies and stock; new, used, any for wishes.
    Q_status:
      name: status
      in: query
      schema:
        type: string
      description: Completeness sealed, complete, incomplete or unknown (copies); order status (orders).
    Q_storage:
      name: storage
      in: query
      schema:
        type: string
      description: Storage id, or null for Not stored.
    Q_place:
      name: place
      in: query
      schema:
        type: string
      description: Purchase location id, or null.
    Q_flag:
      name: flag
      in: query
      schema:
        type: string
      description: Flag id.
    Q_lot:
      name: lot
      in: query
      schema:
        type: string
      description: Lot id, or null for none.
    Q_problem:
      name: problem
      in: query
      schema:
        type: string
      description: missing or damaged.
    Q_duplicates:
      name: duplicates
      in: query
      schema:
        type: string
      description: true for several copies, false for one.
    Q_archived:
      name: archived
      in: query
      schema:
        type: string
      description: true or include (default exclude), or only.
    Path_id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Path_stock_id:
      name: stock_id
      in: path
      required: true
      schema:
        type: string
    Q_spare:
      name: spare
      in: query
      schema:
        type: string
      description: 0 or 1.
    Q_parent:
      name: parent
      in: query
      schema:
        type: string
      description: Parent figure number.
    Path_part_id_int:
      name: part_id
      in: path
      required: true
      schema:
        type: integer
    Q_inventory:
      name: inventory
      in: query
      schema:
        type: string
      description: parts, figures or instructions (web Inventory tabs).
    Q_kind:
      name: kind
      in: query
      schema:
        type: string
      description: Kind filter.
    Q_source:
      name: source
      in: query
      schema:
        type: string
      description: Source key.
    Q_source_id:
      name: source_id
      in: query
      schema:
        type: string
      description: Source identifier.
    Q_copy_id:
      name: copy_id
      in: query
      schema:
        type: string
      description: Copy id (repeatable where an export).
    Q_completes:
      name: completes
      in: query
      schema:
        type: string
      description: true to keep only matches that complete a copy.
    Q_has_file:
      name: has_file
      in: query
      schema:
        type: string
      description: true to keep the file records whose PDF is on disk, false those whose PDF is missing from the media folder.
    Q_guide:
      name: guide
      in: query
      schema:
        type: string
      description: sold, stock, retail, manual or valuation.
    Q_under_max:
      name: under_max
      in: query
      schema:
        type: string
      description: true to keep wishes priced under their maximum.
    Q_move_to_unstored:
      name: move_to_unstored
      in: query
      schema:
        type: string
      description: true to move contents to Not stored when archiving.
    Q_confirm:
      name: confirm
      in: query
      schema:
        type: string
      description: The reference count shown by the preceding read; deletion is refused if it differs.
    Q_bricklink_order_id:
      name: bricklink_order_id
      in: query
      schema:
        type: string
      description: BrickLink order number.
    Path_line_id_int:
      name: line_id
      in: path
      required: true
      schema:
        type: integer
    Path_doc_id_int:
      name: doc_id
      in: path
      required: true
      schema:
        type: integer
    Q_entity:
      name: entity
      in: query
      schema:
        type: string
      description: Event entity prefix.
    Q_field:
      name: field
      in: query
      schema:
        type: string
      description: Event field.
    Q_via:
      name: via
      in: query
      schema:
        type: string
      description: app, cli, api, import or migration.
    Q_since:
      name: since
      in: query
      schema:
        type: string
      description: ISO-8601 timestamp; events at or after.
    Q_undoable:
      name: undoable
      in: query
      schema:
        type: string
      description: true to keep events that can still be undone.
    Q_state:
      name: state
      in: query
      schema:
        type: string
      description: Job state.
    Q_failed:
      name: failed
      in: query
      schema:
        type: string
      description: true for jobs with a failed step.
    Path_source:
      name: source
      in: path
      required: true
      schema:
        type: string
    Path_item_id:
      name: id
      in: path
      required: true
      x-mcp-item: true
      schema:
        type: integer
        minimum: 1
      description: 'Brick Work item id. Ids are per install (design 3.1): store numbers, not ids.'
    Path_set_item_id:
      name: set_id
      in: path
      required: true
      x-mcp-item: true
      schema:
        type: integer
        minimum: 1
      description: Brick Work item id of the set.
    Path_figure_item_id:
      name: item_id
      in: path
      required: true
      x-mcp-item: true
      schema:
        type: integer
        minimum: 1
      description: Brick Work item id of the figure.
    Path_wish_id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Wish uuid (Q6).
    Path_wishlist_id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Wishlist id.
    Q_item_kind:
      name: kind
      in: query
      schema:
        $ref: '#/components/schemas/Kind'
      description: Item kind.
    Q_provider:
      name: provider
      in: query
      schema:
        type: string
        enum:
        - bricklink
        - rebrickable
        - brickwork
        default: bricklink
      description: 'The space numbers and colours are given in (decision 3 and 4): bricklink (default), rebrickable, or brickwork (Brick Work ids; colours
        on /items/{id} paths).'
    Q_number:
      name: number
      in: query
      schema:
        type: string
      description: Item number in the provider space.
    Q_color:
      name: color
      in: query
      schema:
        type: integer
      description: Colour id in the provider space (decision 4).
  responses:
    Problem:
      description: Any other error, including 401 unauthorized, 403 forbidden and 5xx. Always application/problem+json with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No token, bad token, revoked or expired token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Token lacks the scope, or the instance is read only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: Method not supported for this path (405 method_not_allowed).
      headers:
        Allow:
          description: Supported HTTP methods for this path.
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State changed, duplicate, idempotency key reused with another body, or Undo blocked by a later change.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Invalid:
      description: Validation failed; errors[] names the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match did not match the current ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyFailed:
      description: Key, source or catalogue not configured (source_not_configured, source_disabled, catalogue_not_loaded).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BudgetExhausted:
      description: Daily budget or remote throttle; Retry-After header and retry_after field; job_id when a job holds the call.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Moved:
      description: 'The id was merged away: 307 to the survivor, never cached (merges can be undone).'
      headers:
        Location:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Ambiguous:
      description: The number names several items; candidates lists them.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Merged:
      description: The id was merged away; survivor names the live item. Write to it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unidentified:
      description: The number resolves to no item and the request cannot create one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: The operation arrives with the piece named in the body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
    PageInfo:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
        total:
          type:
          - integer
          - 'null'
      required:
      - limit
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        api:
          type: string
        app:
          type: string
          description: The running Brick Work version, as in /version.
        schema:
          type: string
        catalogue_loaded:
          type: boolean
      required:
      - status
      - api
    Version:
      type: object
      properties:
        api:
          type: string
        app:
          type: string
        schema:
          type: string
        read_only:
          type: boolean
        features:
          type: array
          items:
            type: string
      required:
      - api
    Me:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - name
      - scopes
    Token:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - scopes
    TokenCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - read
            - write
            - admin
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - name
      - scopes
    TokenCreated:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/Token'
        secret:
          type:
          - string
          - 'null'
      required:
      - token
      - secret
      description: secret is returned once and never again; the answer a replay of the same request gets has it null (the replay record never holds it).
    CatalogueItem:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/Item'
        name:
          type:
          - string
          - 'null'
        year:
          type:
          - integer
          - 'null'
        owned:
          type: integer
        wished:
          type: boolean
        category:
          type:
          - string
          - 'null'
        theme:
          type:
          - string
          - 'null'
          description: The Rebrickable theme of a set or minifigure from the catalogue (a part has none). Item properties fetched later may name another.
      required:
      - item
    ItemDetail:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/Item'
        properties: {}
        counts:
          type: object
          properties:
            owned:
              type: integer
            wished:
              type: boolean
          required:
          - owned
          - wished
        copies:
          type: array
          items:
            $ref: '#/components/schemas/Copy'
        stock:
          type: array
          items:
            $ref: '#/components/schemas/Stock'
        wishes:
          type: array
          items:
            $ref: '#/components/schemas/Wish'
        prices: {}
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLine'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ItemLink'
        used_in:
          description: The live copies that hold the item (a part or a figure), as `GET /items/{id}/used-in`.
          type: array
          items:
            $ref: '#/components/schemas/UsedIn'
        gaps:
          description: The gaps on this item, and (for a set) the gaps of its copies, as `GET /gaps`.
          type: array
          items:
            $ref: '#/components/schemas/Gap'
        matches:
          description: The loose stock that fills those gaps, as `GET /matches`.
          type: array
          items:
            $ref: '#/components/schemas/Match'
      required:
      - item
    InventoryLine:
      type: object
      properties:
        child:
          $ref: '#/components/schemas/Item'
        name:
          type:
          - string
          - 'null'
        color:
          oneOf:
          - $ref: '#/components/schemas/Color'
          - type: 'null'
        quantity:
          type:
          - integer
          - 'null'
        extra_quantity:
          type: integer
        source:
          type: string
    UsedIn:
      type: object
      properties:
        copy_id:
          type: string
        item:
          $ref: '#/components/schemas/Item'
        name:
          type:
          - string
          - 'null'
        quantity:
          type:
          - integer
          - 'null'
        missing:
          type:
          - integer
          - 'null'
        color:
          oneOf:
          - $ref: '#/components/schemas/Color'
          - type: 'null'
    Image:
      type: object
      properties:
        id:
          description: The picture number of a cached provider picture, the 32-character hex id of an own photo.
          oneOf:
          - type: integer
          - type: string
        item:
          $ref: '#/components/schemas/Item'
        color:
          oneOf:
          - $ref: '#/components/schemas/Color'
          - type: 'null'
        source:
          type: string
        kind:
          type: string
          enum:
          - photo
          - render
          - box
          - booklet
          - own
        width:
          type:
          - integer
          - 'null'
        height:
          type:
          - integer
          - 'null'
        fetched_at:
          type:
          - string
          - 'null'
          format: date-time
        copy_id:
          type:
          - string
          - 'null'
        stock_id:
          type:
          - string
          - 'null'
        caption:
          type:
          - string
          - 'null'
        content_url:
          type: string
      required:
      - id
    ImportRequest:
      type: object
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - identity
            - inventory
            - matching
            - pictures
            - metadata
            - market_price
      description: Optional step subset; default is the stored import order for the item's kind. The sources of a step are the stored order of its kind.
    CopyCreate:
      type: object
      properties:
        item:
          allOf:
          - $ref: '#/components/schemas/ItemKey'
          description: The item, by number (decision 3) or by id.
        quantity:
          type: integer
        condition:
          type: string
          enum:
          - new
          - used
        completeness:
          type: string
          enum:
          - sealed
          - complete
          - incomplete
        decision:
          type: string
          enum:
          - another
          - skip
        storage_id:
          type:
          - string
          - 'null'
        purchase_location_id:
          type:
          - string
          - 'null'
        purchase_date:
          type:
          - string
          - 'null'
          description: ISO-8601 date or date-time, as stored.
        purchase_price:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: Decimal string, never a float.
        purchase_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3,8}$
      required:
      - item
    CopyPatch:
      type: object
      properties:
        condition:
          type: string
          enum:
          - new
          - used
        completeness:
          type: string
          enum:
          - sealed
          - complete
          - incomplete
        completeness_source:
          type: string
          enum:
          - manual
          - derived
        storage_id:
          type:
          - string
          - 'null'
        purchase_location_id:
          type:
          - string
          - 'null'
        purchase_date:
          type:
          - string
          - 'null'
          description: ISO-8601 date or date-time, as stored.
        purchase_price:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: Decimal string, never a float.
        purchase_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3,8}$
        current_value:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: Decimal string, never a float.
        current_value_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3,8}$
        note:
          type:
          - string
          - 'null'
      description: Only these fields; at least one. null clears.
    FlagSet:
      type: object
      properties:
        flags:
          type: array
          items:
            type: string
      required:
      - flags
    Pin:
      type: object
      properties:
        pinned:
          type: boolean
      required:
      - pinned
    Checked:
      type: object
      properties:
        checked:
          type: boolean
      required:
      - checked
      additionalProperties: false
    Completeness:
      type: object
      properties:
        stored:
          type:
          - string
          - 'null'
          enum:
          - sealed
          - complete
          - incomplete
          - null
        completeness_source:
          type: string
          enum:
          - manual
          - derived
        derived:
          type:
          - string
          - 'null'
          enum:
          - sealed
          - complete
          - incomplete
          - null
        checked:
          type: boolean
        missing:
          type: integer
        damaged:
          type: integer
        missing_figures:
          type: integer
      required:
      - stored
    CheckState:
      type: object
      properties:
        session:
          description: The saved part-check session (id, order, cursor, answers, misses, undo, finished, sort, spares, scope, saved_at; `scope` is `missing` for a missing-only run, `skipped` for a walk of the skipped parts, null for the whole set), or null when none was started.
        rows:
          description: The sequence of the check. One entry per required part line (kind part), whole figure (figure) and spare line (spare) with token, id, item, name, color, quantity, missing, damaged, checked and image_id; a figure carries parts_lines and parts_missing.
