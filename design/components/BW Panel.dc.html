<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../sources/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../sources/tokens-v2.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono&family=Patrick+Hand&display=swap" rel="stylesheet">
</helmet>
<div class="{{ themeClass }}" style="background:var(--tw-bg);color:var(--tw-text);font-family:var(--tw-font);padding:28px;display:flex;flex-direction:column;gap:28px;border:0.5px solid var(--tw-divider);border-radius:16px;box-sizing:border-box;width:100%;--bw-g:{{ ground }};--bw-i:{{ ink }};--bw-s:{{ soft }}">
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--tw-text-muted)">{{ label }}</div>
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--tw-text-muted)">{{ themeName }}</div>
  </div>

  <div style="display:flex;align-items:flex-end;gap:24px">
    <svg viewBox="0 0 96 96" width="144" height="144"><rect width="96" height="96" rx="24" style="fill:var(--bw-g)"></rect><use href="#art-{{ dir }}" style="--bw-st:var(--bw-i)"></use></svg>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <svg viewBox="0 0 96 96" width="64" height="64"><use href="#art-{{ dir }}" style="--bw-st:var(--bw-g)"></use></svg>
      <div style="font-size:11px;color:var(--tw-text-muted)">Line</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
    <div style="background:var(--bw-g);color:var(--bw-i);border-radius:10px;padding:12px;font-size:14px;font-weight:600;min-height:64px;display:flex;flex-direction:column;justify-content:space-between">Aa<span style="font:400 10px/14px var(--tw-mono)">{{ groundText }}</span></div>
    <div style="background:var(--bw-s);color:var(--tw-text);border-radius:10px;padding:12px;font-size:14px;font-weight:600;min-height:64px;display:flex;flex-direction:column;justify-content:space-between">Soft<span style="font:400 10px/14px var(--tw-mono)">{{ softText }}</span></div>
    <div style="background:var(--tw-accent);color:var(--tw-bg);border-radius:10px;padding:12px;font-size:14px;font-weight:600;min-height:64px;display:flex;flex-direction:column;justify-content:space-between">Clay<span style="font:400 10px/14px var(--tw-mono)">interaction</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--tw-text-muted)">Favicon · 16 and 32</div>
    <div style="display:flex;align-items:center;gap:12px;background:var(--tw-surface);border-radius:10px;padding:10px 14px;width:fit-content">
      <svg viewBox="0 0 96 96" width="16" height="16"><rect width="96" height="96" rx="24" style="fill:var(--bw-g)"></rect><use href="#art-{{ dir }}" style="--bw-st:var(--bw-i)"></use></svg>
      <span style="font-size:13px;color:var(--tw-text-2)">Brick Work</span>
      <svg viewBox="0 0 96 96" width="32" height="32" style="margin-left:16px"><rect width="96" height="96" rx="24" style="fill:var(--bw-g)"></rect><use href="#art-{{ dir }}" style="--bw-st:var(--bw-i)"></use></svg>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--tw-text-muted)">Home screen</div>
    <div style="display:grid;grid-template-columns:repeat(4,60px);gap:18px;background:var(--tw-surface);border-radius:16px;padding:18px;width:fit-content">
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:60px;height:60px;border-radius:14px;background:var(--tw-surface-2);border:0.5px solid var(--tw-divider);box-sizing:border-box"></div><span style="font-size:10px;color:var(--tw-text-2)">Notes</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:60px;height:60px;border-radius:14px;background:var(--tw-accent);display:grid;place-items:center"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="var(--tw-bg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 6.5 7 Q 6 5.5 7.5 5.5 Q 12 5 16.5 5.5 Q 18 5.5 17.5 7 Q 18.5 12 17.5 17 Q 18 18.5 16.5 18.5 Q 12 19 7.5 18.5 Q 6 18.5 6.5 17 Q 5.5 12 6.5 7 Z"></path></svg></div><span style="font-size:10px;color:var(--tw-text-2)">Toni</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><svg viewBox="0 0 96 96" width="60" height="60"><rect width="96" height="96" rx="22" style="fill:var(--bw-g)"></rect><use href="#art-{{ dir }}" style="--bw-st:var(--bw-i)"></use></svg><span style="font-size:10px;color:var(--tw-text-2)">Brick Work</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:60px;height:60px;border-radius:14px;background:var(--tw-surface-2);border:0.5px solid var(--tw-divider);box-sizing:border-box"></div><span style="font-size:10px;color:var(--tw-text-2)">Weather</span></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--tw-text-muted)">Lockup</div>
    <div style="display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:12px"><svg viewBox="0 0 96 96" width="44" height="44"><rect width="96" height="96" rx="24" style="fill:var(--bw-g)"></rect><use href="#art-{{ dir }}" style="--bw-st:var(--bw-i)"></use></svg><span style="font-family:'Patrick Hand',cursive;font-size:34px;line-height:1;color:var(--tw-text)">Brick Work</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><svg viewBox="0 0 96 96" width="64" height="64"><rect width="96" height="96" rx="24" style="fill:var(--bw-g)"></rect><use href="#art-{{ dir }}" style="--bw-st:var(--bw-i)"></use></svg><span style="font-family:'Patrick Hand',cursive;font-size:28px;line-height:1;color:var(--tw-text)">Brick Work</span></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--tw-text-muted)">App top bar</div>
    <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:0.5px solid var(--tw-divider);background:var(--tw-bg);border-top:0.5px solid var(--tw-divider)">
      <div style="display:flex;align-items:center;gap:10px"><svg viewBox="0 0 96 96" width="24" height="24"><rect width="96" height="96" rx="24" style="fill:var(--bw-g)"></rect><use href="#art-{{ dir }}" style="--bw-st:var(--bw-i)"></use></svg><span style="font-size:17px;font-weight:600;letter-spacing:-0.2px">Brick Work</span></div>
      <div style="display:flex;align-items:center;gap:16px"><span style="font-size:14px;color:var(--tw-accent-text)">Filter</span><span style="background:var(--tw-accent);color:var(--tw-bg);font-size:14px;font-weight:500;border-radius:10px;padding:0 14px;height:36px;display:flex;align-items:center">Add set</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const P = {
      a: { n: 'Courses', l: [0.48, 0.09, 195], d: [0.74, 0.10, 195], sl: [0.89, 0.045, 195], sd: [0.35, 0.065, 195] },
      b: { n: 'Studs', l: [0.46, 0.12, 340], d: [0.75, 0.10, 340], sl: [0.89, 0.045, 340], sd: [0.35, 0.065, 340] },
      d: { n: 'Courses, in progress', l: [0.50, 0.10, 215], d: [0.76, 0.10, 215], sl: [0.89, 0.045, 215], sd: [0.35, 0.065, 215] },
      c: { n: 'Steps', l: [0.47, 0.12, 295], d: [0.76, 0.09, 295], sl: [0.89, 0.045, 295], sd: [0.35, 0.065, 295] },
    };
    const dir = this.props.dir || 'a', dark = !!this.props.dark, p = P[dir];
    const f = v => `oklch(${v[0]} ${v[1]} ${v[2]})`;
    const g = dark ? p.d : p.l, s = dark ? p.sd : p.sl;
    return {
      dir, themeClass: dark ? 'tw-dark' : '', themeName: dark ? 'Dark' : 'Light',
      label: dir.toUpperCase() + ' · ' + p.n,
      ground: f(g), soft: f(s), ink: dark ? '#1A1816' : '#FAFAF8',
      groundText: f(g).replace('oklch(', '').replace(')', ''), softText: f(s).replace('oklch(', '').replace(')', ''),
    };
  }
}
</script>
</body>
</html>
