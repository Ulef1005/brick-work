# The ci tier of the gate (Repo Gates, ADR 0043): scripts/check.sh with every test, on a pull request marked ready, on every push to
# main and on manual start. A draft runs nothing.
# The Mac runs the land tier (no test suite) plus the private patterns check, which never leaves the Mac.
name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}   # a manual run never cancels main's push run
  cancel-in-progress: true

jobs:
  # The pytest tests run as four parallel jobs (three until 2026-11-20: the shards were 5.4, 6.6 and 6.3 minutes, a fourth cuts the longest by about a minute) (scripts/check.sh with BW_SHARD, tests/xdist_groups.py; #364): shard 1 also runs every other step of the
  # gate. The job named `check` at the end is the one result: it fails unless all four shards passed, so a pull request's check keeps its name.
  shard:
    name: check shard ${{ matrix.shard }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the history
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0   # Node tests run on pull requests too (Ulf, 2026-11-26; replaces 2026-11-13)
        with:
          node-version: "22"
      # The rendered tests run in CI (ADR 0022): scripts/check.sh gets the pinned Chrome for Testing through scripts/chrome.py, which checks its
      # SHA-256; the cache saves the ~200 MB download. BW_SKIP_RENDERED is never set here, so a missing browser fails the job. Pull requests run the
      # Chrome tests too (Ulf, 2026-11-26): the Mac no longer runs them before a merge.
      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/brickwork/chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('scripts/chrome.py') }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Secret scan   # once per run, in shard 1; check.sh skips its own scan in CI only with the marker below (Repo Gates)
        id: secretscan
        if: matrix.shard == 1
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark the secret scan as run   # check.sh fails on GitHub without this marker
        if: matrix.shard == 1 && steps.secretscan.outcome == 'success'
        run: echo "GATE_SECRET_SCAN=done" >> "$GITHUB_ENV"
      # A pull request that changes only documentation runs the docs check and the site build, not the app (#254, ADR 0024). Pushes to main always run
      # everything. scripts/check_scope.py answers `docs` only when it can list the changed files (base...head, so a moved base does not count);
      # a new branch, a force push or any failure to diff answers `full`.
      - name: Which check
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=full
          if [[ $EVENT == pull_request ]]; then mode=$(python3 scripts/check_scope.py "$BASE" "$HEAD") || mode=full; fi
          [[ $mode == docs ]] || mode=full
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Check mode: $mode"
      - name: scripts/check.sh
        run: APP_VENV=.venv bash scripts/check.sh
        env:
          BW_CHECK_MODE: ${{ steps.scope.outputs.mode }}
          BW_SHARD: ${{ matrix.shard }}/4
          BW_CHROME_NO_SANDBOX: "1"  # the runner's user namespaces may be restricted; the pages are our own test fixtures
          DOCS_RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || '' }}
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screen-diffs-${{ matrix.shard }}
          path: build/screen-diffs/
          if-no-files-found: ignore

  check:
    name: check
    needs: shard
    # a run cancelled by a newer push shows a cancelled check, not a failed one; on a draft it is skipped like the shards
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "The four shards: $RESULT"
          [[ $RESULT == success ]]
