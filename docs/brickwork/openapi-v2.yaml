            $ref: '#/components/schemas/ValuedCopy'
        statistics:
          $ref: '#/components/schemas/PaidVsValue'
    ValuationMoney:
      type: object
      description: An amount in the display currency. `converted` says it was worked out with a rate (`rate` and its date `rate_as_of`, the amount as recorded in `original`); otherwise it is as recorded.
      required:
      - amount
      - currency
      - converted
      - rate
      - rate_as_of
      - original
      properties:
        amount:
          type: string
          description: A decimal with 2 places.
        currency:
          type: string
        converted:
          type: boolean
        rate:
          type: [string, 'null']
        rate_as_of:
          type: [string, 'null']
        original:
          type:
          - object
          - 'null'
          required:
          - amount
          - currency
          properties:
            amount:
              type: string
            currency:
              type: string
    ValuedCopy:
      type: object
      required:
      - id
      - item_id
      - number
      - name
      - year
      - theme
      - condition
      - completeness
      - purchase_date
      - currency
      - paid_original
      - paid
      - paid_reason
      - worth
      - worth_reason
      - worth_source
      - worth_date
      - worth_stale
      - worth_sales
      - worth_price_source
      - worth_discount_pct
      - gain
      properties:
        id:
          type: string
        item_id:
          type: integer
        number:
          type: string
          description: The set number, for example 7286-1.
        name:
          type: string
        year:
          type: [integer, 'null']
        theme:
          type: string
        condition:
          type: [string, 'null']
          enum: [new, used, null]
        completeness:
          type: [string, 'null']
          enum: [sealed, complete, incomplete, null]
        purchase_date:
          type: [string, 'null']
        currency:
          type: string
          description: The display currency every figure of the copy is in.
        paid_original:
          type:
          - object
          - 'null'
          description: The price paid as recorded; null when there is none.
          required:
          - amount
          - currency
          properties:
            amount:
              type: string
            currency:
              type: string
        paid:
          anyOf:
          - $ref: '#/components/schemas/ValuationMoney'
          - type: 'null'
        paid_reason:
          type: [string, 'null']
          enum: [no_price_paid, no_rate, null]
          description: Why `paid` is null.
        worth:
          anyOf:
          - $ref: '#/components/schemas/ValuationMoney'
          - type: 'null'
        worth_reason:
          type: [string, 'null']
          enum: [no_quote, no_rate, null]
          description: Why `worth` is null.
        worth_source:
          type: [string, 'null']
          enum: [override, used, new, null]
          description: '`override` is the copy''s own value ("Your value"); `used` and `new` are the sold average of the copy''s set.'
        worth_date:
          type: [string, 'null']
          description: The day of the quote; null for the copy's own value.
        worth_stale:
          type: boolean
        worth_sales:
          type: [integer, 'null']
          description: The number of sales behind the sold average.
        worth_price_source:
          type: [string, 'null']
          description: The price source of the quote, for example bricklink.
        worth_discount_pct:
          type: [number, 'null']
          description: The incomplete-set discount (copies with a gap) taken off the quote, in percent.
        gain:
          type:
          - object
          - 'null'
          description: Worth minus price paid (negative for a loss) and its whole percent of the price paid (null when the price paid is 0.00 after conversion); the whole object is null unless both are known.
          required:
          - amount
          - percent
          - currency
          properties:
            amount:
              type: string
            percent:
              type: [integer, 'null']
            currency:
              type: string
    ValuationGroup:
