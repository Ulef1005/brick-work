          - string
          - 'null'
        purchase_location_id:
          type:
          - string
          - 'null'
        purchase_date:
          type:
          - string
          - 'null'
          description: ISO-8601 date or date-time, as stored.
        purchase_price:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: Decimal string, never a float.
        purchase_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3,8}$
        note:
          type:
          - string
          - 'null'
        current_value:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: Decimal string, never a float.
        current_value_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3,8}$
        pinned:
          type: boolean
        flags:
          type: array
          items:
            type: string
        missing:
          type: integer
        damaged:
          type: integer
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        etag:
          type: string
        image_id:
          type:
          - integer
          - 'null'
