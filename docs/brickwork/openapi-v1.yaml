  responses:
    Problem:
      description: "Any other error, including 401 unauthorized, 403 forbidden and 5xx. Always application/problem+json with a stable code."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "No token, bad token, revoked or expired token."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "Token lacks the scope, or the instance is read only."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "No such record."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: "Method not supported for this path (405 method_not_allowed)."
      headers:
        Allow:
          description: "Supported HTTP methods for this path."
          required: true
          schema:
            type: "string"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "State changed, duplicate, idempotency key reused with another body, or Undo blocked by a later change."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: "Validation failed; errors[] names the fields."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: "If-Match did not match the current ETag."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    DependencyFailed:
      description: "Key, source or catalogue not configured (source_not_configured, source_disabled, catalogue_not_loaded)."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    BudgetExhausted:
      description: "Daily budget or remote throttle; Retry-After header and retry_after field; job_id when a job holds the call."
      headers:
        Retry-After:
          schema:
            type: "integer"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: "object"
      properties:
        type:
          type: "string"
        title:
          type: "string"
        status:
          type: "integer"
        code:
          type: "string"
          enum:
            - "bad_request"
            - "unknown_filter"
            - "unauthorized"
            - "forbidden"
            - "read_only_instance"
            - "not_found"
            - "method_not_allowed"
            - "archived"
            - "conflict"
            - "stale_match"
            - "undo_blocked"
            - "not_undoable"
            - "idempotency_conflict"
            - "precondition_failed"
            - "payload_too_large"
            - "unsupported_media_type"
            - "validation_failed"
            - "unsupported_setting"
            - "source_not_configured"
            - "source_disabled"
            - "catalogue_not_loaded"
            - "idempotency_key_required"
            - "budget_exhausted"
            - "source_throttled"
            - "too_many_attempts"
            - "source_error"
            - "not_set_up"
            - "api_disabled"
            - "db_unavailable"
            - "internal_error"

        detail:
          type: "string"
        instance:
          type: "string"
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/FieldError"
        retry_after:
          type:
            - "integer"
            - "null"
        job_id:
          type:
            - "integer"
            - "null"
        source:
          type:
            - "string"
            - "null"
      required:
        - "type"
        - "title"
        - "status"
        - "code"
      description: "RFC 9457 problem+json. code is the stable machine key."
    FieldError:
      type: "object"
