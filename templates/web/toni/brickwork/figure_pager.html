<nav class="bc-pager" aria-label="Pages">{% if pager.prev %}<a class="bc-page-step bc-page-prev" href="{{ pager.prev }}">Previous</a>{% else %}<span class="bc-page-step" aria-disabled="true">Previous</span>{% endif %}<div class="bc-page-numbers">{% for i in pager['items'] %}{% if i.n is none %}<span class="bc-page-gap">…</span>{% else %}<a class="bc-page-number{{ '' if i.n in (1,pager.page,pager.pages) else ' bc-page-neighbour' }}" href="{{ i.url }}"{% if i.n==pager.page %} aria-current="page"{% endif %}>{{ i.n }}</a>{% endif %}{% endfor %}</div>{% if pager.next %}<a class="bc-page-step bc-page-next" href="{{ pager.next }}">Next</a>{% else %}<span class="bc-page-step" aria-disabled="true">Next</span>{% endif %}<p class="mono">{{ pager.first }} to {{ pager.last }} of {{ pager.total }}</p></nav>
