# Renders the CANDIDATE baselines of the screenshot gate on the platform the gate compares on (ubuntu-latest, linux64; ADR 0022).
# Run by hand at approval: the session downloads the `baselines` artifact and commits those PNGs with the APPROVALS.md line and `approved: true`.
name: baselines

on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Screen names or NN prefixes, space-separated (e.g. '09 10-Set-detail'); empty = all built states"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache Chrome for Testing
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/brickwork/chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('scripts/chrome.py') }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Capture the candidates
        # The input goes through an environment variable, never into the script text (script injection); the shell splits it into screen names.
        run: .venv/bin/python scripts/screen_gate.py capture $SCREENS
        env:
          SCREENS: ${{ inputs.screens }}
          BW_CHROME_NO_SANDBOX: "1"  # the runner's user namespaces may be restricted; the pages are our own test fixtures
      - name: Upload the baselines
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: baselines
          path: design/screens/approval/baselines/
          if-no-files-found: error
