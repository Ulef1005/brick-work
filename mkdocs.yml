# The docs site (App Docs Standard, ai-wiki apps/references/app-docs-standard): Zensical reads this file unchanged.
# Three tabs (Home, User guide, Developers) from the explicit nav: below. Every built page is in nav: and every nav: entry
# exists: tests/test_docs_nav.py checks it. A new docs page needs its nav: entry in the same change.
site_name: Brick Work
docs_dir: docs
# Repo only (App Docs Standard): ADRs, project records and dated records. A link to one of them points at GitHub.
exclude_docs: |
  adr/
  approval/
  milestones/
  img/readme/
  pitch/README.md
  brickwork/api-v1.md
  brickwork/openapi-v1.yaml
  brickwork/cutover-4.11j.md
  brickwork/schema-notes.md
  data-model-4.0/README.md
  data-model-4.0/effort.md
  data-model-4.0/regression-map.md
  data-model-4.0/schema-4.0.sql
theme:
  name: material
  font: false  # no Google Fonts: Inter and Geist Mono come from docs/assets/fonts (the theme CSS), so no external requests
  favicon: assets/favicon.svg
  # Light and dark with a toggle: without a palette the #only-light / #only-dark images both show (doc-standard-v1 B1)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/app-icon.svg
  features: [navigation.tabs, navigation.sections, navigation.indexes, search.highlight]
# The theme: generated from the served tokens by scripts/docs_theme.py (doc-standard-v1 B2, design/APPROVALS.md); edit the tokens, not the CSS.
extra_css: [assets/brickwork-docs.css]
extra_javascript: [assets/screens.js]
markdown_extensions: [admonition, tables, toc, attr_list, pymdownx.details, pymdownx.highlight, pymdownx.superfences]
# The API v2 and MCP reference pages are printed by a markdown-exec block at build time (scripts/docs_reference.py), and the code
# reference is rendered by mkdocstrings from brickwork.core's docstrings (ADR 0030). An explicit plugins: list replaces the default
# one, so search is named too. Preview from the repo root with `PYTHONPATH=. zensical serve`.
plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_submodules: true
            show_source: false
            members_order: source
            show_root_heading: false
            show_root_toc_entry: false
            heading_level: 2
            # Private names, and the importer's vendored migrations, copied unchanged from upstream (their README in brickwork/core/importer/)
            filters: ["!^_[^_]", "!_migrations$"]
nav:
  - Home:
      - index.md
      - "The original pitch (v0.5.0, 22.10.2026)": pitch/brick-work-pitch.pdf
      # The changelog page is built by scripts/build_site.py beside /docs/, so this link is dead under `zensical serve` alone.
      - "What's new": ../changelog/
  - User guide:
      - Tutorials:
          - tutorials/index.md
          - tutorials/first-set.md
          - tutorials/finish-a-half-built-set.md
          - tutorials/build-from-your-bulk.md
          - tutorials/find-the-sets-in-a-bulk-lot.md
          - tutorials/build-from-what-you-have.md
      - How-to guides:
