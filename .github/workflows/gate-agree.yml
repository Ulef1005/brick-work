# Proves that a capture of the screenshot gate does not depend on the Chrome session (#267, ADR 0024): renders every approved state on one Chrome
# process and on four, on the platform the gate compares on (ubuntu-latest, linux64), and fails when any capture differs by more than the gate's tolerance.
# Run by hand; the two renders are kept as the `gate-agree` artifact.
name: gate-agree

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/gate-agree.yml"]   # a new workflow file can only be dispatched from the default branch, so the pull request that changes it runs it

permissions:
  contents: read

jobs:
  agree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/brickwork/chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('scripts/chrome.py') }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Render serial and parallel, compare
        run: .venv/bin/python scripts/screen_gate.py agree
        env:
          BW_CHROME_NO_SANDBOX: "1"  # the runner's user namespaces may be restricted; the pages are our own test fixtures
          BW_GATE_KEEP: ${{ github.workspace }}/build/gate-agree
      - name: Upload both renders
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: gate-agree
          path: build/gate-agree/
          if-no-files-found: ignore
