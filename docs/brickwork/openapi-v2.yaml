# Brick Work API v2: the contract of the whole surface (M.11a, issue #113). Generated in step with api-v2.md.
# x-piece says which piece implements an operation (M.11a to M.11d); x-v1 names the v1 operation it replaces.
# An operation of a piece that has not landed answers 501 not_implemented (scripts/check_api_contract.py lists them).
openapi: 3.1.0
info:
  title: Brick Work API
  version: 2.0.0-draft
  summary: 'API v2 for the 4.0 line: v1''s resource set, envelopes and conventions with the 4.0 identity (design 7).'
  description: 'The contract of the whole v2 surface (M.11a, issue #113); a piece implements its operations against this file (`x-piece`). An operation
    whose piece has not landed answers 501 not_implemented. Items are addressed by Brick Work id (`/items/{id}`, install-local: store numbers, not ids)
    or by provider number (`/sets|parts|minifigures/by-number/{no}`, `/lookup`); bodies carry both. Conventions are api-v2.md. No per-token rate limit.
    Stored hashed tokens with scopes read, write, admin, plus BW_API_TOKEN as an environment bootstrap. Writes are one transaction plus an event with via=api
    and actor=token name and are undoable through POST /events/{id}/undo.'
