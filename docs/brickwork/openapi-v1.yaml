  - name: "Wishlist"
  - name: "Storages"
  - name: "Lots"
  - name: "Places"
  - name: "Flags"
  - name: "Planning"
  - name: "Orders"
  - name: "Events"
  - name: "Jobs"
  - name: "Sources"
  - name: "Settings"
  - name: "Admin"
  - name: "Tokens"
x-m3-receipts:
  storage: "One events row per M3 request: entity bw_api, field op:<key> (receipt without a key). new_value contains method, path, body_sha256, status, response, event_id, token_name and embedded core receipts. Undo rows also contain undone_event_id and have no Undo of their own."
  dispatch: "Embedded receipts are passed to collection.undo, add.undo, workbench.undo, ledger.undo and planning.undo. Standalone core and token receipts remain supported; token Undo requires admin."
  pagination: "Events and jobs use SQL keysets on id (descending by default). Current prices use rowid keysets (ascending by default). Price history uses id keysets (descending by default); item-price summaries include the latest 200 records. Page totals are null for these growing histories."

x-mcp:
  milestone: M7
  transports: [stdio, streamable-http]
  http-path: /mcp
  results: "Single reads return data; lists retain page cursors; writes retain API receipts; API errors set isError."
  idempotency: "Optional idempotency_key is forwarded; otherwise a UUID is generated. Retries must reuse the same key."
  hosting: "ASGI host mounts SDK /mcp alongside the Flask WSGI routes; plain WSGI does not serve MCP."
  write-gate: "allow-write and API write scope; checked again on every call"
  resources:
    "brickwork://summary": "get_statistics"
    "brickwork://copies/{id}": "get_copies_by_id"
    "brickwork://items/{type}/{no}": "get_items_by_type_by_no"
    "brickwork://wishlist": "get_wishes"
    "brickwork://storages": "get_storages"
    "brickwork://sources": "get_sources"
    "brickwork://events/recent": "get_events"
    "brickwork://openapi": "get_openapi_yaml"

