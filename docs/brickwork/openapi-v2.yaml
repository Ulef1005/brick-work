  /planning/set-scores:
    get:
      operationId: get_planning_set_scores
      x-mcp-tool: get_planning_set_scores
      summary: The catalogue's sets ranked by how much of a pile of loose parts each explains.
      description: 'Scores the live loose stock of one lot, one storage (and the storages inside it), all loose stock, or a saved selection of stock lines
        (`stock`, repeated) against the active catalogue build; give exactly one of `lot`, `storage`, `loose=true` or `stock`. Read-only. Each set carries
        the evidence (the sum, over the lines of the pile that the set holds, of the line''s rarity weight ln(N/df) times the covered share of the set''s
        quantity), the coverage (evidence over the set''s own total weight), the covered and complete lines, the distinctive lines found of the set''s
        distinctive ones, the matched lines (the heaviest `detail` of them, with the stock flags passed through and summed per flag), and the swaps: the same
        part in another colour or as an alternate mould, listed apart and never counted in any number. Ranked by evidence, then coverage, then set id.
        ADR 0026.'
      tags:
      - Planning
      security:
      - bearerAuth:
        - read
      parameters:
      - name: lot
        in: query
        description: A lot id; scores its live loose parts and figures.
        schema:
          type: string
      - name: storage
        in: query
        description: A storage id; scores the live loose stock kept in it and in the storages inside it.
        schema:
          type: string
      - name: loose
        in: query
        description: true scores all live loose parts and figures.
        schema:
          type: boolean
      - name: stock
        in: query
        description: Stock line ids (live loose parts or figures), 1 to 5000 different ones.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 5000
          uniqueItems: true
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: detail
        in: query
        description: How many matched lines each set lists (the numbers always count all of them).
        schema:
          type: integer
          minimum: 0
          maximum: 50
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
