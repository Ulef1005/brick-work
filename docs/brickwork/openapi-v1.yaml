# Brick Work API v1: M0–M9 implemented; standalone cutover complete.
# Generated in step with api-v1.md; the resource and operation tables there match this file.
# x-new: true marks operations that need new code. x-backing names the existing function wrapped.
openapi: "3.1.0"
info:
  title: "Brick Work API"
  version: "1.0.0-draft"
  summary: "Decisions accepted 2026-10-15. M0 foundations through M9 standalone cutover implemented in 4.11b–4.11j."
  description: "JSON plus PDF, photo (15 MB) and identification multipart uploads. Embedded job drainer by default; brickwork worker for headless installs. No per-token rate limit. BrickLink daily budget defaults to 4,400 as a safety margin for other tools sharing the key. Stored hashed tokens with scopes read, write, admin, plus BW_API_TOKEN as an environment bootstrap that cannot be revoked through the API. Writes are one transaction plus an events row with via=api and actor=token name and are undoable through POST /events/{id}/undo. x-new marks an operation that needs new code; x-backing names the existing function it wraps."
x-standalone-cutover:
  milestone: "M8/M9"
  browser-paths: "Root paths; no redirects. See cutover-4.11j.md."
  legacy-import: "core.importer; CLI migrate --extras is optional; Tools & Admin import-legacy."
  smoke-test: "tests/test_standalone_smoke.py; sockets blocked; run by scripts/check.sh."
x-schema-version: "3.3"
x-error-status:
  bad_request: 400
  unknown_filter: 400
  unauthorized: 401
  forbidden: 403
  read_only_instance: 403
  not_found: 404
  method_not_allowed: 405
  archived: 409
  conflict: 409
  stale_match: 409
  undo_blocked: 409
  not_undoable: 409
  idempotency_conflict: 409
  precondition_failed: 412
  payload_too_large: 413
  unsupported_media_type: 415
  validation_failed: 422
  unsupported_setting: 422
  source_not_configured: 424
  source_disabled: 424
  catalogue_not_loaded: 424
  idempotency_key_required: 428
  budget_exhausted: 429
  source_throttled: 429
  too_many_attempts: 429
  source_error: 502
  not_set_up: 503
  api_disabled: 503
  db_unavailable: 503
  internal_error: 500
servers:
  - url: "/api/v1"
    description: "Relative to the app origin."
security:
  - bearerAuth:
      - "read"
