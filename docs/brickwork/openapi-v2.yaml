          properties:
            lines:
              type: integer
            quantity:
              type: integer
            matched_lines:
              type: integer
              description: Lines of the pile that at least one set holds.
            unmatched_lines:
              type: integer
            unmatched:
              type: array
              description: Up to 50 of the lines no set holds.
