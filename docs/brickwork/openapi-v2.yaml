      description: One line per item, colour and condition, each with the BrickLink type, number and colour number the XML names it by. A line with no confirmed BrickLink number is not in the XML; it is in `skipped` with the reason.
      security:
      - bearerAuth:
        - read
      parameters:
      - name: ids
        in: query
        description: Comma-separated copy IDs (1 to 2000 unique IDs).
        schema:
          type: string
      - name: copy_id
        in: query
        description: Repeated copy IDs; alternative to comma-separated ids.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 2000
          uniqueItems: true
      responses:
        '200':
          description: Missing items.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - item
                      - color
                      - quantity
                      - condition
                      - bricklink
                      properties:
                        item:
                          $ref: '#/components/schemas/Item'
                        color:
                          oneOf:
                          - $ref: '#/components/schemas/Color'
                          - type: 'null'
                        quantity:
                          type: integer
                        condition:
                          enum:
                          - new
                          - used
                          - null
                        bricklink:
                          description: The BrickLink type, item number and colour number of the wanted-list line.
                          type: object
                          required:
                          - type
                          - 'no'
                          - color_id
                          properties:
                            type:
                              type: string
                            'no':
                              type: string
                            color_id:
                              type:
                              - integer
                              - 'null'
                  skipped:
                    description: Lines the XML leaves out because BrickLink cannot name them.
                    type: array
                    items:
                      type: object
                      required:
                      - item
                      - color
                      - quantity
                      - condition
                      - why
                      properties:
                        item:
                          $ref: '#/components/schemas/Item'
                        color:
                          oneOf:
                          - $ref: '#/components/schemas/Color'
                          - type: 'null'
                        quantity:
                          type: integer
                        condition:
                          enum:
                          - new
                          - used
                          - null
                        why:
                          type: string
