# Vale for the docs (App Docs Standard: User Docs, Vale; Developer Docs, Checks). Run: python3 scripts/vale.py check
# User docs follow the Microsoft style, developer docs the Google style (tie-break list, Ulf 2026-11-13). The app's own terms are in the BrickWork vocabulary.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = BrickWork

[docs/{tutorials,how-to,concepts}/**/*.md]
BasedOnStyles = Microsoft, BrickWork
# Contractions are allowed, not required (App Docs Standard: User Docs, Tone and voice).
Microsoft.Contractions = NO
# A heading may name a feature or a format (API, CSV): the acronym is the name.
Microsoft.HeadingAcronyms = NO

[docs/reference/{index,metrics,set-scoring,settings}.md]
BasedOnStyles = Microsoft, BrickWork
Microsoft.Contractions = NO
Microsoft.HeadingAcronyms = NO

[docs/{developer,brickwork}/**/*.md]
BasedOnStyles = Google, BrickWork
# The app's pages and labels are in British English (Colour is a UI term, which wins over both style guides).
Google.Spelling = NO
# Reads hexadecimal ids such as 4ebb11d as 11 days.
Google.Units = NO

[docs/reference/cli.md]
BasedOnStyles = Google, BrickWork
Google.Spelling = NO
# The headings are command names, which keep their lowercase; "Admin" is the Tools & Admin menu.
Google.Headings = NO
Google.WordListCase = NO
# Reads hexadecimal ids such as 4ebb11d as 11 days.
Google.Units = NO

# The generated references have no hand-written prose.
[docs/developer/{api-v2-reference,mcp-reference,code-reference}.md]
BasedOnStyles =

# Pages the site leaves out (mkdocs.yml exclude_docs) are not linted.
[docs/brickwork/{api-v1,cutover-4.11j,schema-notes}.md]
BasedOnStyles =

# "admin" is the name of a token scope and "Admin" a menu label and operation group: values, not the role.
[docs/brickwork/{api-v2,mcp,sync}.md]
BasedOnStyles = Google, BrickWork
Google.Spelling = NO
Google.Units = NO
Google.WordListCase = NO

# A developer tutorial that lives in tutorials/ (App Docs Standard: Developer Docs): the Google style, as audience: developer says.
[docs/tutorials/script-your-collection.md]
BasedOnStyles = Google, BrickWork
# UI labels are bold and written as the UI writes them (Tools & Admin).
TokenIgnores = (\*\*[^*\n]+\*\*)
Google.Spelling = NO
Google.Units = NO
